<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://assets-bucket.deadlock-api.com; connect-src 'self' https://api.deadlock-api.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postmortem</title>
<link rel="preload" href="assets/fonts/valveoracle-semibold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/radiance-semibold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="hero-backdrop.css">
<link rel="stylesheet" href="summary/summary.css">
</head>
<body>
<div id="summaryBackdrop" aria-hidden="true" hidden>
  <div class="backdrop" id="backdrop"><i></i><b></b></div>
  <canvas class="dust" id="dust"></canvas>
  <div class="grain"></div>
</div>
<div id="stage">
  <header class="topPanel">
    <div class="gameClock"><span id="clock">0:00</span></div>
    <div class="teamsRow">
      <div id="teamLeft" class="teamCtn left"></div>
      <div class="teamNetworth">
        <button id="scoreLeft" class="teamScore" title="Show only this team. Click again to show everyone."></button>
        <button id="scoreRight" class="teamScore right" title="Show only this team. Click again to show everyone."></button>
        <div id="avgLeft" class="teamAvg"></div>
        <div id="avgRight" class="teamAvg right"></div>
      </div>
      <div id="teamRight" class="teamCtn right"></div>
    </div>
  </header>

  <nav id="tabs" class="tabs" hidden>
    <button class="tab" data-tab="summary" disabled>Summary</button>
    <button class="tab on" data-tab="graphs">Graphs</button>
    <button class="tab" data-tab="matchups">Matchups</button>
    <button class="tab" data-tab="mvp">MVP</button>
    <span id="lobbyRank" class="lobbyRank"></span>
    <span id="companionSource" hidden>From your app · awaiting Valve data</span>
  </nav>
  <span id="tabLoading" hidden>Loading match data</span>

  <main class="mainCol">
    <div class="graphSelectCtn">
      <div class="dropDown" id="graphDD" tabindex="0">
        <span class="dropDownIntro">Graph Type:</span>
        <span class="dropDownLabel" id="ddLabel"></span>
        <span class="carat"></span>
        <div class="dropDownMenu" id="ddMenu" hidden></div>
      </div>
      <div class="graphOptionsCtn">
        <div class="graphOption" id="optPick">
          <span class="optionLabel">Show:</span>
          <button class="graphOptionButton" id="pickAll"></button>
          <button class="graphOptionButton" id="pickTeamL"></button>
          <button class="graphOptionButton" id="pickTeamR"></button>
          <button class="graphOptionButton" id="pickNone"></button>
          <button class="graphOptionButton" id="pickLane"></button>
        </div>
        <div class="graphOption" id="optMode">
          <span class="optionLabel">View As:</span>
          <button class="graphOptionButton" data-v="value">Value</button>
          <button class="graphOptionButton" data-v="permin" title="Each value divided by minutes played so far">Per Minute</button>
          <button class="graphOptionButton" data-v="share" title="Each hero's share of their team's total at that time">% of Team</button>
          <button class="graphOptionButton" data-v="team" title="Each team's players added together">Teams</button>
          <button class="graphOptionButton" data-v="lane" title="Each team's players in one lane added together">Lanes</button>
        </div>
        <div class="graphOption" id="optDiff" hidden>
          <span class="optionLabel">Two Players:</span>
          <button class="graphOptionButton" data-v="off">Both</button>
          <button class="graphOptionButton" data-v="on">Difference</button>
        </div>
        <div class="graphOption" id="optLane" hidden></div>
        <div class="graphOption" id="optLaneTime" hidden></div>
        <div class="graphOption" id="optMarks">
          <span class="optionLabel">Markers:</span>
          <div class="markControl">
            <button class="graphOptionButton markToggle" id="markObj" data-mark="obj" aria-pressed="false">Objectives</button>
            <button class="graphOptionButton markArrow" aria-label="Objective marker options" aria-expanded="false" aria-controls="objMenu"></button>
            <div class="markMenu" id="objMenu" role="group" aria-label="Objectives" hidden>
              <div class="markHeading">Objectives</div>
              <div id="markTypes"></div>
              <fieldset>
                <legend>Lines down the graph</legend>
                <div class="markChoices">
                  <label><input type="radio" name="guides" value="big"><span>Big ones</span></label>
                  <label><input type="radio" name="guides" value="all"><span>All</span></label>
                  <label><input type="radio" name="guides" value="none"><span>None</span></label>
                </div>
              </fieldset>
            </div>
          </div>
          <div class="markControl">
            <button class="graphOptionButton markToggle" id="markDeaths" data-mark="deaths" aria-pressed="false">Deaths</button>
            <button class="graphOptionButton markArrow" aria-label="Death marker options" aria-expanded="false" aria-controls="deathMenu"></button>
            <div class="markMenu" id="deathMenu" role="group" aria-label="Deaths" hidden>
              <div class="markHeading">Deaths</div>
              <fieldset>
                <legend>Show fights for</legend>
                <div class="markChoices">
                  <label><input type="radio" name="scope" value="picked"><span>Picked heroes</span></label>
                  <label><input type="radio" name="scope" value="everyone"><span>Everyone</span></label>
                </div>
              </fieldset>
              <label class="markCheck"><input type="checkbox" name="skulls"><span>Deaths, with time dead</span></label>
              <label class="markCheck"><input type="checkbox" name="kills"><span>Kills, with victim portraits</span></label>
              <label class="markCheck"><input type="checkbox" name="assists"><span>Assists <small>(best guess)</small></span></label>
              <label class="markCheck markSplit"><input type="checkbox" name="fadeDead"><span>Fade a hero's lines while dead</span></label>
            </div>
          </div>
          <div class="markControl">
            <button class="graphOptionButton markToggle" id="markItems" data-mark="items" aria-pressed="false">Items</button>
            <button class="graphOptionButton markArrow" aria-label="Item marker options" aria-expanded="false" aria-controls="itemMenu"></button>
            <div class="markMenu" id="itemMenu" role="group" aria-label="Items" hidden>
              <div class="markHeading">Items</div>
              <fieldset>
                <legend>Show</legend>
                <div class="markChoices">
                  <label><input type="radio" name="buys" value="all"><span>Every buy</span></label>
                  <label><input type="radio" name="buys" value="tier3"><span>Tier 3 and up</span></label>
                  <label><input type="radio" name="buys" value="final"><span>Final build only</span></label>
                </div>
              </fieldset>
              <label class="markCheck"><input type="checkbox" name="upgradeBadge"><i class="purchaseBadge upgrade" aria-hidden="true"></i><span>Upgrade badges</span></label>
              <label class="markCheck"><input type="checkbox" name="saleBadge"><i class="purchaseBadge sale" aria-hidden="true"></i><span>Sale badges</span></label>
              <p>Faded items left the build.</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="graphCtn" id="graphCtn">
      <svg id="chart" role="img" aria-label="Match graph"></svg>
      <svg id="chartLines" class="chartLayer" aria-hidden="true"></svg>
      <svg id="chartFocus" class="chartLayer" aria-hidden="true"></svg>
      <div id="xhairs" class="xhairs"></div>
      <div id="plotHeads" class="plotHeads"></div>
      <div id="focusTags" class="focusTags"></div>
      <div id="markers" class="markers"></div>
      <div id="markerHover" class="markerHover" aria-hidden="true" hidden>
        <i class="ownedBar"></i><i class="itemGuide"></i><i class="itemGuide end"></i>
      </div>
      <div id="tooltip" class="tooltip" hidden></div>
      <div id="empty" class="empty" hidden></div>
    </div>

    <div id="overview" class="overview"></div>
    <aside id="lineLegend" class="lineLegend" hidden></aside>

    <div id="laneView" class="laneView"></div>

    <div class="lineRow" id="lineRow" hidden>
      <span class="optionLabel">Lines:</span>
      <div id="lines" class="lines"></div>
    </div>
  </main>

  <main id="summaryView" aria-label="Match summary" hidden></main>
  <div id="summaryTip" role="tooltip" hidden></div>
  <section id="mvpView" class="mvpView"></section>
  <section id="muView" class="mvpView muView"></section>

  <a id="backLink" class="backLink" href="profile.html" hidden><svg viewBox="0 0 10 16" aria-hidden="true"><path d="M8 1 2 8l6 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to profile</a>
  <form id="matchForm" class="matchForm">
    <label for="matchInput">Match</label>
    <input id="matchInput" inputmode="numeric" autocomplete="off" placeholder="Match ID">
    <button type="submit" class="graphOptionButton">Load</button>
    <a id="profileLookup" class="graphOptionButton profileLookup" href="profile.html" hidden>Find a player</a>
    <span id="landingDownload" class="landingDownload" hidden>
      <a id="companionDownload" class="graphOptionButton profileLookup" aria-describedby="companionBuild" download>Download the app</a>
      <small id="companionBuild"></small>
    </span>
  </form>
  <div id="status" class="status"></div>
  <div id="companionControls" class="companionControls">
    <button id="companionLink" class="graphOptionButton" type="button" hidden>Link companion</button>
    <form id="companionPair" hidden>
      <label>Pairing code <input name="code" minlength="6" maxlength="6" autocomplete="off" spellcheck="false" required></label>
      <label><input name="remember" type="checkbox"> Remember this viewer</label>
      <button class="graphOptionButton" type="submit">Link</button>
    </form>
    <span id="companionMessage" role="status"></span>
  </div>
  <div id="perf" class="perf" hidden></div>
</div>

<script src="heroes.js"></script>
<script src="gamedata.js"></script>
<script src="heronorms.js"></script>
<script src="herothemes.js"></script>
<script src="hero-backdrop.js"></script>
<script src="player-assets.js"></script>
<script src="scoring.js"></script>
<script src="graph-markers.js"></script>
<script src="companion-preview.js"></script>
<script src="companion-download.js"></script>
<script src="app.js"></script>
<script src="mvp.js"></script>
<script src="matchups.js"></script>
<script src="lanes.js"></script>
<script src="summary/percentile.js"></script>
<script src="summary/fights.js"></script>
<script src="summary/timeline.js"></script>
<script src="summary/summary.js"></script>
<script src="dust.js"></script>
</body>
</html>
