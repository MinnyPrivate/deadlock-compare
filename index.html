<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadlock Compare</title>
<link rel="preload" href="assets/fonts/valveoracle-semibold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/radiance-semibold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <header class="topPanel">
    <div class="gameClock"><span id="clock">0:00</span></div>
    <div class="teamsRow">
      <div id="teamLeft" class="teamCtn left"></div>
      <div class="teamNetworth">
        <button id="scoreLeft" class="teamScore" title="Show only this team. Click again to show everyone."></button>
        <button id="scoreRight" class="teamScore right" title="Show only this team. Click again to show everyone."></button>
        <div id="avgLeft" class="teamAvg"></div>
        <div id="avgRight" class="teamAvg right"></div>
      </div>
      <div id="teamRight" class="teamCtn right"></div>
    </div>
  </header>

  <nav id="tabs" class="tabs">
    <button class="tab on" data-tab="graphs">Graphs</button>
    <button class="tab" data-tab="matchups">Matchups</button>
    <button class="tab" data-tab="mvp">MVP</button>
    <span id="lobbyRank" class="lobbyRank"></span>
  </nav>

  <main class="mainCol">
    <div class="graphSelectCtn">
      <div class="dropDown" id="graphDD" tabindex="0">
        <span class="dropDownIntro">Graph Type:</span>
        <span class="dropDownLabel" id="ddLabel"></span>
        <span class="carat"></span>
        <div class="dropDownMenu" id="ddMenu" hidden></div>
      </div>
      <div class="graphOptionsCtn">
        <div class="graphOption" id="optPick">
          <span class="optionLabel">Show:</span>
          <button class="graphOptionButton" id="pickLane"></button>
          <button class="graphOptionButton" id="pickAll"></button>
          <button class="graphOptionButton" id="pickNone"></button>
        </div>
        <div class="graphOption" id="optMode">
          <span class="optionLabel">View As:</span>
          <button class="graphOptionButton" data-v="value">Value</button>
          <button class="graphOptionButton" data-v="permin" title="Each value divided by minutes played so far">Per Minute</button>
          <button class="graphOptionButton" data-v="share" title="Each hero's share of their team's total at that time">% of Team</button>
          <button class="graphOptionButton" data-v="team" title="One line per team: all six heroes added together">Teams</button>
          <button class="graphOptionButton" data-v="lane" title="One line per lane pair: the two heroes in each lane added together">Lanes</button>
        </div>
        <div class="graphOption" id="optDiff" hidden>
          <span class="optionLabel">Two Players:</span>
          <button class="graphOptionButton" data-v="off">Both</button>
          <button class="graphOptionButton" data-v="on">Difference</button>
        </div>
        <div class="graphOption" id="optObj">
          <span class="optionLabel">Objectives:</span>
          <button class="graphOptionButton" data-v="on">Show</button>
          <button class="graphOptionButton" data-v="off">Hide</button>
        </div>
      </div>
    </div>

    <div class="graphCtn" id="graphCtn">
      <svg id="chart" role="img" aria-label="Match graph"></svg>
      <div id="markers" class="markers"></div>
      <div id="itemRows" class="itemRows"></div>
      <div id="tooltip" class="tooltip" hidden></div>
      <div id="empty" class="empty" hidden></div>
    </div>

    <div class="lineRow" id="lineRow" hidden>
      <span class="optionLabel">Lines:</span>
      <div id="lines" class="lines"></div>
      <span class="lineHint" id="lineHintStatic">Click to hide a line type. Ctrl+Click to show only that one.</span>
    </div>
  </main>

  <section id="mvpView" class="mvpView"></section>
  <section id="muView" class="mvpView muView"></section>

  <form id="matchForm" class="matchForm">
    <label for="matchInput">Match</label>
    <input id="matchInput" inputmode="numeric" autocomplete="off" placeholder="Match ID">
    <button type="submit" class="graphOptionButton">Load</button>
  </form>
  <div id="status" class="status"></div>
</div>

<script src="heroes.js"></script>
<script src="gamedata.js"></script>
<script src="app.js"></script>
<script src="mvp.js"></script>
<script src="matchups.js"></script>
</body>
</html>
