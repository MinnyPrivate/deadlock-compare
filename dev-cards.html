<!doctype html>
<html lang="en" class="card-gallery">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'">
  <title>Highlights card gallery</title>
  <link rel="stylesheet" href="style.css">
  <link id="card-styles" rel="stylesheet" href="summary/summary.css">
  <link rel="stylesheet" href="dev-cards.css">
  <script src="dev-cards.js" defer></script>
</head>
<body class="tabSummary">
  <main id="summaryView">
    <header class="gallery-header">
      <h1>Highlights card gallery</h1>
      <nav aria-label="Preview settings">
        <button data-width="website">Website</button>
        <button data-width="ingame">In-game panel</button>
        <button data-state="both">Side by side</button>
        <button data-state="rest">Resting only</button>
        <button data-state="hover">Forced hover only</button>
      </nav>
      <p id="gallery-status" role="status">Loading saved matches…</p>
    </header>
    <div id="gallery-matches"></div>
  </main>
</body>
</html>
